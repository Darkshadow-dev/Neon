<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Arduino Web IDE</title>

<style>
body { background:#111; color:#0f0; font-family:monospace; }
textarea { width:100%; height:250px; background:#000; color:#0f0; }
button { margin:5px; padding:10px; }
#output { white-space:pre-wrap; background:#000; padding:10px; margin-top:10px; }
</style>
</head>

<body>

<h2>Arduino Web IDE</h2>

<textarea id="code">
void setup() {
  Serial.begin(9600);
}

void loop() {
  Serial.println("Upload test!");
  delay(1000);
}
</textarea>

<br>

<button onclick="compile()">Compile</button>

<select id="ports">
  <option value="COM3">COM3</option>
  <option value="COM4">COM4</option>
  <option value="COM5">COM5</option>
  <option value="COM6">COM6</option>
  <option value="COM7">COM7</option>
  <option value="COM8">COM8</option>
  <option value="COM9">COM9</option>
</select>

<button onclick="upload()">Upload</button>

<div id="output"></div>

<script>
async function compile() {
  const code = document.getElementById("code").value;

  let res = await fetch("http://localhost:5000/compile", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({code})
  });

  let data = await res.json();
  document.getElementById("output").textContent = data.output;
}


async function upload() {
  let port = document.getElementById("ports").value;

  let res = await fetch("http://localhost:5000/upload", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({port})
  });

  let data = await res.json();
  document.getElementById("output").textContent = data.output;
}
</script>

</body>
</html>
