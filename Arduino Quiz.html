<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="Images/Website-Guide.png">
<title>Arduino Quiz Hub</title>

<style>
:root{
  --bg:#f5faff;
  --panel:#ffffff;
  --accent:#00979d;
  --accent2:#00c853;
  --text:#0b1c2d;
}

/* ===== RESET ===== */
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:system-ui,Arial;
  background:var(--bg);
  color:var(--text);
}

/* ===== LAYOUT ===== */
#app{
  display:flex;
  height:120vh;
}

/* ===== SIDEBAR ===== */
#sidebar{
  width:220px;
  background:#050814;
  color:#aaa;
}

#sidebar h2{
  text-align:center;
  padding:12px;
  border-bottom:1px solid #222;
}

.cat{
  width:100%;
  padding:12px;
  background:none;
  border:none;
  color:#aaa;
  cursor:pointer;
  text-align:left;
}

.cat:hover,
.cat.active{
  background:#1a2cff;
  color:#fff;
}

/* ===== MAIN ===== */
#main{
  flex:1;
  display:flex;
  flex-direction:column;
}

/* ===== TOPBAR ===== */
#topbar{
  min-height:50px;
  max-height:50px;
  background:#050814;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
}

nav{
  display:flex;
  gap:10px;
}

nav a{
  color:#00cfff;
  text-decoration:none;
  padding:6px 10px;
}

nav a:hover{
  background:rgba(0,151,157,.2);
  border-radius:6px;
}

/* ===== CONTENT ===== */
#mainContent{
  padding:20px;
  overflow:auto;
}

/* ===== QUIZ ===== */
.question{
  background:var(--panel);
  padding:12px;
  margin-bottom:12px;
  border-radius:10px;
  box-shadow:0 4px 10px rgba(0,0,0,.05);
}

.answers button{
  width:100%;
  margin:6px 0;
  padding:10px;

  border:none;
  border-radius:10px;

  background:linear-gradient(145deg,#eef6ff,#dceeff);
  cursor:pointer;
  font-weight:600;

  transition:.2s;
}

.answers button:hover{
  transform:translateY(-2px);
  background:#cfe9ff;
}

.answers button.selected{
  background:#00979d;
  color:white;
}

.answers button.correct{
  background:#00c853;
  color:white;
}

.answers button.wrong{
  background:#ff5252;
  color:white;
}

.correct{background:#d4f8d4;}
.wrong{background:#ffd6d6;}

#quizSelect{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:16px;
}

#quizSelect button{
  padding:8px 14px;
  border:none;
  border-radius:8px;
  background:#e6f7ff;
  cursor:pointer;
  font-weight:600;
  transition:.2s;
}

#quizSelect button:hover{
  background:#ccefff;
  transform:translateY(-1px);
}

#quizSelect button.active{
  background:#00979d;
  color:white;
}

.question{
  background:white;
  padding:12px;
  margin-bottom:12px;
  border-radius:10px;
  box-shadow:0 4px 10px rgba(0,0,0,.05);
}

.question.correct{background:#d4f8d4;}
.question.wrong{background:#ffd6d6;}
.question.partial{background:#fff3cd;}

.question input,
.question textarea{
  margin-top:6px;
  padding:6px;
  width:100%;
  border-radius:6px;
  border:1px solid #ccc;
}

.answers label{
  display:block;
  margin:4px 0;
  cursor:pointer;
}

/* ===== BUTTONS ===== */
#controls{
  margin-top:20px;
}

#controls button{
  padding:10px 16px;
  border:none;
  background:#1a2cff;
  color:white;
  cursor:pointer;
  margin-right:10px;
}

#controls button:disabled{
  opacity:0.5;
  cursor:not-allowed;
}

#rankBox{
  display:flex;
  align-items:center;
  gap:6px;
  font-weight:bold;
}
.xp-summary{margin:8px 10px 14px;color:#cbd5e1;font-size:12px;line-height:1.5}
.xp-summary strong{display:block;color:#fff;font-size:18px}
.xp-summary progress{display:block;width:100%;height:8px;margin:7px 0;accent-color:#22c55e}
.xp-summary small{color:#94a3b8}
#challengeCounter{margin:0 10px 8px;color:#aab5c8;font-size:12px;line-height:1.45}
#quizSelect button.red{
  background:#ff5252;
  color:white;
}

#quizSelect button.yellow{
  background:#ffd54f;
  color:black;
}

#quizSelect button.green{
  background:#00c853;
  color:white;
}
::-webkit-scrollbar{display:none}
/* HEADER TITLE */
.headerTitle{
  font-weight:bold;
  font-size:18px;
}
#codeUnlocks{
  margin-top:10px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.codeBtn{
  padding:10px;
  border:none;
  border-radius:8px;
  background:#222;
  color:white;
  cursor:pointer;
  font-weight:bold;
}

.codeBtn.locked{
  background:#555;
  cursor:not-allowed;
  opacity:0.6;
}

.codeArea textarea{
  width:100%;
  min-height:150px;
  max-height:550px;
  margin-top:10px;
  font-family:monospace;
}

.codeArea input{
  width:100%;
  margin-top:6px;
}
/* ================= GLOBAL RESPONSIVE (NO LAYOUT BREAK) ================= */

/* shrink sidebar slightly on small screens */
@media(max-width:1100px){
  #sidebar{
    width:180px;
  }
}

/* smaller spacing for tablets */
@media(max-width:900px){

  #topbar{
    padding:8px 10px;
  }

  nav a{
    font-size:13px;
    padding:5px 8px;
  }

  #mainContent{
    padding:12px;
  }

  .question{
    padding:10px;
  }

  .answers button{
    padding:10px;
    font-size:14px;
  }
}

/* mobile — SAME LAYOUT, just tighter */
@media(max-width:600px){

  #sidebar{
    width:150px;
  }

  #sidebar h2{
    font-size:14px;
  }

  .cat{
    font-size:12px;
    padding:8px;
  }

  #topbar{
    min-height:40px;
    max-height:40px;
    font-size:14px;
  }

  nav{
    gap:4px;
  }

  nav a{
    font-size:12px;
    padding:4px 6px;
  }

  #mainContent{
    padding:8px;
  }

  #quizSelect{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:6px;
  }

  #quizSelect button{
    font-size:12px;
    padding:8px;
  }

  .answers button{
    padding:10px;
    font-size:13px;
  }
}


#editorWrap{
  display:flex;
  height:calc(100vh - 120px);
}

/* LEFT LINE NUMBERS */
#lineNums{
    width:50px;
    padding:10px 5px;
    color:#666;
    text-align:right;
    font-size:14px;
    line-height:1.4;
    overflow:hidden;
    white-space:pre;
}

/* EDITOR BOX */
#editorBox{
  position:relative;
  flex:1;
}

/* BOTH LAYERS */
#editor, #highlight{
  position:absolute;
  inset:0;
  font-family:monospace;
  font-size:14px;
  line-height:1.4;
  padding:10px;
  white-space:pre-wrap;
  word-wrap:break-word;
  overflow:auto;
  margin:0;
  border:none;
}

/* SYNTAX LAYER */
#highlight{
  pointer-events:none;
  z-index:1;
}

/* TEXT INPUT */
#editor{
  background:transparent;
  color:transparent;
  caret-color:#0865bd;
  z-index:2;
  resize:none;
  outline:none;
}

/* ===== CODE CHALLENGE SAVE / STATUS ===== */

.codeSaveStatus{
  margin-top:8px;
  font-size:13px;
  color:#64748b;
}

.codeSaveStatus.saved{

}

.codeSaveStatus.error{

}

.codeResult{

}

.codeResult.success{

  color:#08752d;
}

.codeResult.failed{

}

.codeResult.warning{

.codeSavedProjects{

}

.savedProject{

.savedProject button{

  border:none;

  background:#00979d;
  color:white;
  cursor:pointer;
}

.challengeComplete{
  color:#00c853;
  font-weight:bold;
}

</style>

<script>

let currentQuiz = [];

// ===== LOAD CATEGORY =====
function loadCategory(category, btn){
mode = "quiz";
document.getElementById("quizSelect").style.display = "flex";
document.getElementById("controls").style.display = "block";
document.getElementById("quizArea").innerHTML = "";
  currentCategory = category;
  currentQuizIndex = 0;
  userAnswers = Array.from({ length: data[category].length }, () => []);
  totalQuestions = data[category].length;

  // Highlight active button
  document.querySelectorAll('#sidebar .cat').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');

  // Set title
  document.getElementById('title').textContent = category.charAt(0).toUpperCase() + category.slice(1);

  // Render quiz select buttons
  const qs = document.getElementById('quizSelect');
  qs.innerHTML = '';
data[category].forEach((quiz, i)=>{
  const key = category + "-" + i;
  const saved = progress[key];

  const b = document.createElement('button');
  b.textContent = `Quiz ${i+1}`;

  if(saved){
    const color = getQuizColor(saved.score, saved.total);
    b.classList.add(color);
  }

  b.onclick = ()=>loadQuiz(i);

  if(i===0) b.classList.add('active');

  qs.appendChild(b);
});

  loadQuiz(0);

}

// ===== LOAD QUIZ =====
function loadQuiz(index){
if(mode === "code") return;
  currentQuizIndex = index;

  const key = currentCategory + "-" + index;

  // ensure array exists
  if(!userAnswers[index]) userAnswers[index] = [];

  // restore saved answers
// ALWAYS reset first (fixes "carry over answers")
userAnswers[index] = [];

// priority:
// 1. draft (unfinished quiz)
// 2. saved submitted progress (only if exists)
const draft = JSON.parse(localStorage.getItem(currentCategory + "-" + index + "-draft") || "null");

if(draft){
  userAnswers[index] = draft;
}

  // Highlight active quiz button
  document.querySelectorAll('#quizSelect button').forEach((b,i)=>b.classList.toggle('active', i===index));

  const quizArea = document.getElementById('quizArea');
  quizArea.innerHTML = '';

currentQuiz = randomizeQuiz(data[currentCategory][index]);

const quiz = currentQuiz;
  quiz.forEach((q, i)=>{
    const qDiv = document.createElement('div');
    qDiv.className = 'question';
    qDiv.dataset.qIndex = i;

    const qText = document.createElement('p');
    qText.textContent = `${i+1}. ${q.q}`;
    qDiv.appendChild(qText);

    const ansDiv = document.createElement('div');
    ansDiv.className = 'answers';

    if(q.type==='mc'){
      q.a.forEach((a,j)=>{
        const btn = document.createElement('button');
        btn.textContent = a;
        if(userAnswers[index][i]===j) btn.classList.add('selected');
        btn.onclick = ()=>selectAnswer(i,j,btn);
        ansDiv.appendChild(btn);
      });
    } else if(q.type==='mcm'){
      q.a.forEach((a,j)=>{
        const btn = document.createElement('button');
        btn.textContent = a;
        if(userAnswers[index][i] && userAnswers[index][i].includes(j)) btn.classList.add('selected');
        btn.onclick = ()=>toggleMCM(i,j,btn);
        ansDiv.appendChild(btn);
      });
    } else if(q.type==='fill'){
      const input = document.createElement('input');
      input.value = userAnswers[index][i] || '';
input.oninput = (e)=>{
  userAnswers[index][i]=e.target.value;
  saveDraft();
}
      ansDiv.appendChild(input);
    }

    qDiv.appendChild(ansDiv);
    quizArea.appendChild(qDiv);
  });

  document.getElementById('scoreBox').textContent = '';
  document.getElementById('submitBtn').disabled = false;
}

// ===== SELECT ANSWER (MC) =====
function selectAnswer(qIndex, ansIndex, btn){
  const quiz = data[currentCategory][currentQuizIndex];
  userAnswers[currentQuizIndex][qIndex] = ansIndex;

  // Remove previous selection
  const buttons = btn.parentElement.querySelectorAll('button');
  buttons.forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
saveDraft();
  updateQuizButtonCounter();
}

// ===== TOGGLE MULTIPLE CHOICE MULTIPLE (MCM) =====
function toggleMCM(qIndex, ansIndex, btn){
  userAnswers[currentQuizIndex][qIndex] = userAnswers[currentQuizIndex][qIndex] || [];
  const arr = userAnswers[currentQuizIndex][qIndex];
  const pos = arr.indexOf(ansIndex);
  if(pos>-1) arr.splice(pos,1);
  else arr.push(ansIndex);
  btn.classList.toggle('selected');
  updateQuizButtonCounter();
saveDraft();
}

// ===== UPDATE QUIZ BUTTON COUNTER =====
function updateQuizButtonCounter(){
  const btn = document.querySelectorAll('#quizSelect button')[currentQuizIndex];
  const answered = userAnswers[currentQuizIndex].filter(a=>a!==undefined && a!==null && (Array.isArray(a)?a.length>0:true)).length;
btn.textContent = `Quiz ${currentQuizIndex+1}`;}
// ===== SUBMIT QUIZ =====
function submitQuiz(){
const quiz = currentQuiz;
  let score = 0;

  quiz.forEach((q,i)=>{
    const ans = userAnswers[currentQuizIndex][i];
    const qDiv = document.querySelector(`.question[data-q-index="${i}"]`);
    qDiv.classList.remove('correct','wrong','partial');

    if(q.type==='mc' || q.type==='logic'){
      if(ans===q.c){
        score++;
        qDiv.classList.add('correct');
      } else {
        qDiv.classList.add('wrong');
      }
    } else if(q.type==='mcm'){
      const correct = q.c.sort().join(',');
      const given = (ans||[]).sort().join(',');
      if(given===correct){
        score++;
        qDiv.classList.add('correct');
      } else if(ans && ans.length>0){
        qDiv.classList.add('partial');
      } else {
        qDiv.classList.add('wrong');
      }
    } else if(q.type==='fill'){
      if(ans && ans.toString().trim().toLowerCase() === q.c.toString().trim().toLowerCase()){
        score++;
        qDiv.classList.add('correct');
      } else qDiv.classList.add('wrong');
    }
  });

  document.getElementById('scoreBox').textContent = `Score: ${score} / ${quiz.length}`;
  document.getElementById('submitBtn').disabled = true;

  // Enable retake
  if(!document.getElementById('retakeBtn')){
    const b = document.createElement('button');
    b.id = 'retakeBtn';
    b.textContent = 'Retake';
    b.onclick = retake;
    document.getElementById('controls').appendChild(b);
  } else document.getElementById('retakeBtn').disabled = false;

const key = currentCategory + "-" + currentQuizIndex;
updateQuizButtonColor(score, quiz.length);
progress[key] = {
  score,
  total: quiz.length,
  answers: [...userAnswers[currentQuizIndex]] // clone (important)
};
updateRank();
  saveProgress();
clearDraft();
}

// ===== RETAKE QUIZ =====
function retake(){
  const key = currentCategory + "-" + currentQuizIndex;

  // remove saved progress
  delete progress[key];
  saveProgress();

  // remove button color
  const btn = document.querySelectorAll('#quizSelect button')[currentQuizIndex];
  btn.classList.remove("red","yellow","green");

  userAnswers[currentQuizIndex] = [];

currentQuiz = [];
loadQuiz(currentQuizIndex);

  document.getElementById("scoreBox").textContent = "";
  document.getElementById("submitBtn").disabled = false;
clearDraft();
userAnswers[currentQuizIndex] = [];
  updateRank();
}
function buildQuizButtons(){
  const box = document.getElementById("quizSelect");
  const list = data[currentCategory];

  list.forEach((quiz, i)=>{
    const key = currentCategory + "-" + i;

    const btn = document.createElement("button");

    let saved = progress[key];
    let scoreText = saved ? `${saved.score}/${data[currentCategory][i].length}` : `0/${data[currentCategory][i].length}`;


    btn.textContent = `Quiz ${i+1} (${scoreText})`;

    btn.onclick = ()=>loadQuiz(i);

    box.appendChild(btn);
  });
}

function shuffleArray(arr){

  const copy=[...arr];

  for(let i=copy.length-1;i>0;i--){

    const j=Math.floor(Math.random()*(i+1));

    [copy[i],copy[j]]=[copy[j],copy[i]];

  }

  return copy;

}

function shuffleQuestion(q){

  if(q.type==="mc"){

    const answers=q.a.map((text,index)=>({
      text,
      correct:index===q.c
    }));

    const shuffled=shuffleArray(answers);

    return{
      ...q,
      a:shuffled.map(x=>x.text),
      c:shuffled.findIndex(x=>x.correct)
    };

  }

  if(q.type==="mcm"){

    const answers=q.a.map((text,index)=>({
      text,
      correct:q.c.includes(index)
    }));

    const shuffled=shuffleArray(answers);

    return{
      ...q,
      a:shuffled.map(x=>x.text),
      c:shuffled
        .map((x,index)=>x.correct?index:null)
        .filter(x=>x!==null)
    };

  }

  return {...q};

}

function randomizeQuiz(quiz){

  const questions=shuffleArray(quiz);

  return questions.map(q=>shuffleQuestion(q));

}

function getMaximumXP(){
  const quizXP = Object.values(data || {}).reduce((sum, quizzes) =>
    sum + quizzes.reduce((categorySum, quiz) => categorySum + quiz.length, 0), 0);
  return quizXP + codeChallenges.length * 5;
}

function getRankLadder(maxXP){
  const names = [
    "Beginner", "Starter", "Learner", "Intermediate", "Advanced",
    "Expert", "Professional", "Master", "Grandmaster", "Elite",
    "Legend", "Mythic", "Arduino Master"
  ];
  const usableMaximum = Math.max(maxXP, (names.length - 1) * 5);
  return names.map((name, index) => ({
    name,
    xp: index === 0 ? 0 : Math.round(usableMaximum * index / (names.length - 1))
  }));
}

function syncChallengeXP(){
  const codeProgress = loadCodeProgress();
  let changed = false;
  codeChallenges.forEach(challenge => {
    if(codeProgress[challenge.id]?.completed === true){
      const key = "code-" + challenge.id;
      if(!progress[key]?.awarded){
        progress[key] = {score:5, total:5, awarded:true, completed:true};
        changed = true;
      }
    }
  });
  if(changed) saveProgress();
}

function updateRank(){
  syncChallengeXP();
  const score = getTotalXP();
  const maxXP = getMaximumXP();
  const ladder = getRankLadder(maxXP);
  let rankIndex = 0;
  ladder.forEach((entry, index) => {
    if(score >= entry.xp) rankIndex = index;
  });
  const rank = ladder[rankIndex].name;
  const nextRank = ladder[rankIndex + 1];

  document.getElementById("rankBox").innerHTML = `
    <img src="${getRankImg(rank)}" alt="${rank} rank badge" style="width:24px;height:24px;object-fit:contain;vertical-align:middle;margin-right:6px;">
    <b>${rank}</b>
  `;

  const totalXPBox = document.getElementById("totalXPBox");
  const xpMeter = document.getElementById("xpMeter");
  const rankProgressText = document.getElementById("rankProgressText");
  if(totalXPBox) totalXPBox.textContent = `${score} XP`;
  if(xpMeter){
    xpMeter.max = maxXP;
    xpMeter.value = Math.min(score, maxXP);
    xpMeter.setAttribute("aria-label", `XP progress: ${score} of ${maxXP}`);
  }
  if(rankProgressText){
    rankProgressText.textContent = nextRank
      ? `${Math.max(0, nextRank.xp - score)} XP to ${nextRank.name} · ${maxXP} XP total`
      : `Maximum rank · ${maxXP} XP total`;
  }

try{
  renderSidebarQuizzes();
}catch(err){
  console.error(err);
}
}
function updateEditor(){

    const editorElement =
        document.getElementById("editor");

    const highlightElement =
        document.getElementById("highlight");

    const lineElement =
        document.getElementById("lineNums");

    if(
        !editorElement ||
        !highlightElement ||
        !lineElement
    ){
        return;
    }

    const code =
        editorElement.value || "";

    /* Use the existing Arduino syntax highlighter */
    highlightElement.innerHTML =
        highlightQuizCode(code);

    /* Keep an extra newline so the last line
       remains aligned with the textarea */
    if(code.endsWith("\n")){
        highlightElement.innerHTML += "\n";
    }

    /* Line numbers */
    const lineCount =
        Math.max(
            1,
            code.split("\n").length
        );

    lineElement.textContent =
        Array.from(
            {length:lineCount},
            (_,index) => index + 1
        ).join("\n");

    /* Keep everything aligned */
    highlightElement.scrollTop =
        editorElement.scrollTop;

    highlightElement.scrollLeft =
        editorElement.scrollLeft;

    lineElement.scrollTop =
        editorElement.scrollTop;
}


function saveProgress(){
  localStorage.setItem("progress", JSON.stringify(progress));
}

function loadProgress(){
  progress = JSON.parse(localStorage.getItem("progress")) || {};
}
function updateQuizButtonColor(score, total){

  btn.classList.remove("red","yellow","green");

  const color = getQuizColor(score, total);
  btn.classList.add(color);
}
function getQuizColor(score, total){
  if(score === 0) return "red";
  if(score === total) return "green";
  return "yellow";
}

function getTotalXP(){
  return Object.values(progress || {})
    .reduce((sum, p) => {
      const score = Number(p && p.score);
      return sum + (Number.isFinite(score) && score > 0 ? score : 0);
    }, 0);
}

function renderSidebarQuizzes(){

  const box =
    document.getElementById("sidebarQuizzes");

  if(!box){
    return;
  }

  box.innerHTML = "";

  const codeProgress = loadCodeProgress();
  const completedCount = codeChallenges.filter(challenge =>
    codeProgress[challenge.id]?.completed === true
  ).length;
  const unlockedCount = codeChallenges.filter(challenge =>
    getTotalXP() >= challenge.need
  ).length;
  const counter = document.getElementById("challengeCounter");
  if(counter){
    counter.textContent = `${completedCount} / ${codeChallenges.length} completed · ${unlockedCount} unlocked`;
  }

  codeChallenges.forEach(challenge => {

    const button =
      document.createElement("button");

    button.className = "codeBtn";

    const unlocked =
      getTotalXP() >= challenge.need;

    const completed =
      isCodeChallengeCompleted(
        challenge.id
      );

    if(!unlocked){
      button.classList.add("locked");
      button.disabled = true;

      button.textContent =
        `${challenge.name} 🔒`;
    }else{

      if(completed){
        button.textContent =
          `${challenge.name} ✓`;
      }else{
        button.textContent =
          challenge.name;
      }

      button.addEventListener(
        "click",
        () => openCodeQuiz(challenge)
      );
    }

    box.appendChild(button);
  });
}

let challengeResult = null;
let challengeTimer = null;

const CODE_STORAGE_PREFIX = "arduino-code-";
const CODE_PROJECT_STORAGE = "arduino-saved-projects";
const CODE_PROGRESS_STORAGE = "arduino-code-progress";

/* ===== LOCAL CODE STORAGE ===== */

function getCodeStorageKey(id){
    return CODE_STORAGE_PREFIX + id;
}

function saveCodeLocally(id){
    if(!id) return;

    const editorElement = document.getElementById("editor");

    if(!editorElement) return;

    const code = editorElement.value;

    localStorage.setItem(
        getCodeStorageKey(id),
        code
    );

    const status =
        document.getElementById("codeSaveStatus");

    if(status){
        status.textContent =
            "✓ Code saved locally";

        status.className =
            "codeSaveStatus saved";
    }
}

function loadCodeLocally(id){
    return localStorage.getItem(
        getCodeStorageKey(id)
    ) || "";
}

function clearSavedCode(id){
    localStorage.removeItem(
        getCodeStorageKey(id)
    );
}

/* ===== PROJECT DATA ===== */

function getSavedProjects(){
    try{
        return JSON.parse(
            localStorage.getItem(
                CODE_PROJECT_STORAGE
            ) || "[]"
        );
    }catch(err){
        console.error(
            "Saved project data corrupted:",
            err
        );

        return [];
    }
}

function saveProjects(projects){
    localStorage.setItem(
        CODE_PROJECT_STORAGE,
        JSON.stringify(projects)
    );
}

/* ===== SAVE CUSTOM PROJECT ===== */

function saveCustomProject(id){
    const titleElement =
        document.getElementById("projTitle");

    const descElement =
        document.getElementById("projDesc");

    const editorElement =
        document.getElementById("editor");

    if(
        !titleElement ||
        !descElement ||
        !editorElement
    ){
        return;
    }

    const title =
        titleElement.value.trim();

    const description =
        descElement.value.trim();

    const code =
        editorElement.value;

    if(!title && !description && !code.trim()){
        return;
    }

    const projects =
        getSavedProjects();

    const projectKey =
        "challenge-" + id;

    const existingIndex =
        projects.findIndex(
            p => p.key === projectKey
        );

    const project = {
        key: projectKey,
        id: id,
        title: title,
        description: description,
        code: code,
        updatedAt: Date.now()
    };

    if(existingIndex >= 0){
        projects[existingIndex] = project;
    }else{
        projects.push(project);
    }

    saveProjects(projects);

    localStorage.setItem(
        "arduino-project-" + id,
        JSON.stringify(project)
    );
}

function loadCustomProject(id){
    const saved =
        localStorage.getItem(
            "arduino-project-" + id
        );

    if(!saved){
        return null;
    }

    try{
        return JSON.parse(saved);
    }catch(err){
        console.error(
            "Invalid saved project:",
            err
        );

        return null;
    }
}

/* ===== CHALLENGE PROGRESS ===== */

function loadCodeProgress(){
    try{
        return JSON.parse(
            localStorage.getItem(
                CODE_PROGRESS_STORAGE
            ) || "{}"
        );
    }catch(err){
        return {};
    }
}

function saveCodeProgress(progress){
    localStorage.setItem(
        CODE_PROGRESS_STORAGE,
        JSON.stringify(progress)
    );
}

function isCodeChallengeCompleted(id){
    const progress =
        loadCodeProgress();

    return !!(
        progress[id] &&
        progress[id].completed === true
    );
}

/* ===== RESTORE CODE ===== */

function restoreCodeChallenge(u){

    const editorElement =
        document.getElementById("editor");

    if(!editorElement){
        return;
    }

    let savedCode = "";

    if(
        u.id === "custom1" ||
        u.id === "custom2"
    ){

        const project =
            loadCustomProject(u.id);

        if(project){

            const titleElement =
                document.getElementById(
                    "projTitle"
                );

            const descElement =
                document.getElementById(
                    "projDesc"
                );

            if(titleElement){
                titleElement.value =
                    project.title || "";
            }

            if(descElement){
                descElement.value =
                    project.description || "";
            }

            savedCode =
                project.code || "";
        }

    }else{
        savedCode =
            loadCodeLocally(u.id);
    }

    editorElement.value =
        savedCode;

    updateEditor();

    const status =
        document.getElementById(
            "codeSaveStatus"
        );

    if(status){

        if(savedCode.trim()){

            status.textContent =
                "✓ Saved code restored";

            status.className =
                "codeSaveStatus saved";

        }else{

            status.textContent =
                "Code will be saved locally.";

            status.className =
                "codeSaveStatus";
        }
    }
}

function clearCurrentCode(){

        return;
    }

    const id =
        activeCodeChallenge;

    if(
        id === "custom1" ||
        id === "custom2"

/* ===== EDITOR INITIALIZATION ===== */

function initEditor(){

    editor =
        document.getElementById("editor");

    highlight =
        document.getElementById("highlight");

    lines =
        document.getElementById("lineNums");

    if(
        !editor ||
        !highlight ||
        !lines
    ){
        return;
    }

    /*
       Prevent duplicate listeners.
    */
    if(editor.dataset.initialized === "true"){
        updateEditor();
        return;
    }

    editor.dataset.initialized = "true";

    editor.addEventListener(
        "input",
        () => {

            updateEditor();

            /*
               Save immediately while typing.
            */
            saveCurrentCode();
        }
    );

    editor.addEventListener(
        "scroll",
        () => {

            highlight.scrollTop =
                editor.scrollTop;

            highlight.scrollLeft =
                editor.scrollLeft;

            lines.scrollTop =
                editor.scrollTop;
        }
    );

    updateEditor();
}

function saveCurrentCode(){

    if(!activeCodeChallenge){
        return;
    }

    const editorElement =
        document.getElementById("editor");

    if(!editorElement){

    }

    const id =
        activeCodeChallenge;

    if(
        id === "custom1" ||
        id === "custom2"
    ){

        saveCustomProject(id);

    }else{

        saveCodeLocally(id);

    }

/* ===== ESCAPE HTML ===== */

function escapeHTML(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function validateArduinoSyntax(source){
    const errors = [];
    const stack = [];
    const matching = {"(":")", "[":"]", "{":"}"};
    const lines = String(source || "").split("");
    let state = "code";
    let quote = "";
    let escaped = false;
    let line = 1;

    for(let i = 0; i < lines.length; i++){
        const ch = lines[i];
        const next = lines[i + 1];
        if(ch === "\n") line++;

        if(state === "line-comment"){
            if(ch === "\n") state = "code";
            else lines[i] = " ";
            continue;
        }
        if(state === "block-comment"){
            if(ch === "*" && next === "/"){
                lines[i] = " "; lines[i + 1] = " "; i++; state = "code";
            }else if(ch !== "\n") lines[i] = " ";
            continue;
        }
        if(state === "string"){
            if(ch !== "\n") lines[i] = " ";
            if(escaped){ escaped = false; continue; }
            if(ch === "\\"){ escaped = true; continue; }
            if(ch === quote) state = "code";
            else if(ch === "\n"){
                errors.push(`Line ${line}: string is missing its closing quote.`);
                state = "code";
            }
            continue;
        }

        if(ch === "/" && next === "/"){
            lines[i] = " "; lines[i + 1] = " "; i++; state = "line-comment"; continue;
        }
        if(ch === "/" && next === "*"){
            lines[i] = " "; lines[i + 1] = " "; i++; state = "block-comment"; continue;
        }
        if(ch === '"' || ch === "'"){
            quote = ch; lines[i] = " "; state = "string"; continue;
        }
        if(ch === "(" || ch === "[" || ch === "{"){
            stack.push({char:ch, line});
        }else if(ch === ")" || ch === "]" || ch === "}"){
            const open = stack.pop();
            if(!open || matching[open.char] !== ch){
                errors.push(`Line ${line}: unexpected closing “${ch}”.`);
            }
        }
    }
    if(state === "block-comment") errors.push("A block comment is missing its closing */.");
    if(state === "string") errors.push(`Line ${line}: string is missing its closing quote.`);
    stack.forEach(open => errors.push(`Line ${open.line}: “${open.char}” is missing its closing “${matching[open.char]}”.`));

    const cleanCode = lines.join("");
    if(!/\bvoid\s+setup\s*\(\s*(?:void\s*)?\)/.test(cleanCode)){
        errors.push("Add the Arduino setup() function: void setup() { ... }.");
    }
    if(!/\bvoid\s+loop\s*\(\s*(?:void\s*)?\)/.test(cleanCode)){
        errors.push("Add the Arduino loop() function: void loop() { ... }.");
    }

    const statementCall = /^(?:pinMode|digitalWrite|digitalRead|analogRead|analogWrite|delay|delayMicroseconds|tone|noTone|Serial\.(?:begin|print|println|write)|EEPROM\.(?:read|write|update))\s*\(.*\)\s*$/;
    const assignment = /^(?:(?:const|volatile|unsigned|signed|long|int|float|double|bool|boolean|byte|char|String|uint\d+_t)\s+)?[A-Za-z_]\w*\s*(?:=|\+=|-=|\*=|\/=)\s*.+$/;
    cleanCode.split("\n").forEach((rawLine, index) => {
        const text = rawLine.trim();
        if(!text || text.startsWith("#") || /[;{}:]$/.test(text)) return;
        if(/^(?:if|else|for|while|switch|case|do|class|struct|enum)\b/.test(text)) return;
        if(/^(?:void|bool|boolean|char|byte|short|int|long|float|double|String|auto|static|unsigned|signed)\s+\w+\s*\([^;]*\)\s*$/.test(text)) return;
        if(statementCall.test(text) || assignment.test(text)){
            errors.push(`Line ${index + 1}: this statement looks like it is missing a semicolon.`);
        }
    });

    return {valid: errors.length === 0, errors:[...new Set(errors)].slice(0, 6)};
}

function checkArduinoSyntax(code){
    const result = validateArduinoSyntax(code);
    if(result.valid) return true;
    showCodeResult("Syntax check: " + result.errors.join(" "), "failed");
    return false;
}

/* =========================================================
   SUBMIT CODE
   ========================================================= */

async function startCodeChallenge(id){

    const editorElement =
        document.getElementById("editor");

    if(!editorElement){
        return;
    }

    const code =
        editorElement.value;

    if(!code.trim()){

        showCodeResult(
            "Write code first!",
            "warning"
        );

        return;
    }

    if(!checkArduinoSyntax(code)) return;

    /*
       ALWAYS save before submitting.
    */
    saveCurrentCode();

    /*
       Already completed?
       We still allow testing/submitting,
       but XP will NOT be awarded again.
    */
    const alreadyCompleted =
        isCodeChallengeCompleted(id);

    const buttons =
        document.querySelectorAll(
            "#quizArea button"
        );

    buttons.forEach(
        b => b.disabled = true
    );

    const resultBox =
        document.getElementById(
            "codeResult"
        );

    if(resultBox){
        resultBox.textContent =
            "⏳ Sending code to compiler...";
        resultBox.className =
            "codeResult";
    }

    try{

        const res =
            await fetch(
                "https://arduino-guide-6.onrender.com/compile",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        code:code
                    })
                }
            );

        if(!res.ok){
            throw new Error(
                "Compiler HTTP error: " +
                res.status
            );
        }

        const result =
            await res.json();

        challengeResult =
            result;

        showCodeResult(
            "⏳ Compiler response received.",
            "warning"
        );

        /*
           Do not use an artificial fixed
           3-second timer for compilation.
           The server response has already arrived.
        */
        showChallengeResult();

    }catch(err){

        console.error(
            "Code challenge error:",
            err
        );

        buttons.forEach(
            b => b.disabled = false
        );

        showCodeResult(
            "❌ Compiler/server error. Your code was saved locally.",
            "failed"
        );

        activeCodeChallenge = id;
    }
}

/* =========================================================
   RESULT
   ========================================================= */

function showChallengeResult(){

    const buttons =
        document.querySelectorAll(
            "#quizArea button"
        );

    buttons.forEach(
        b => b.disabled = false
    );

    if(!challengeResult){

        showCodeResult(
            "❌ No compiler response.",
            "failed"
        );

        return;
    }

    /*
       Check compiler response more safely.
    */
    const output =
        String(
            challengeResult.output || ""
        );

    const lowerOutput =
        output.toLowerCase();

    /*
       A compilation result should not be considered
       successful merely because the word "error"
       is absent from arbitrary output.

       If the server explicitly reports failure,
       fail it. Otherwise require the compiler to
       have actually returned a usable result.
    */

    let passed = challengeResult.success === true ||
        challengeResult.ok === true ||
        challengeResult.compiled === true;

    if(
        lowerOutput.includes(
            "error:"
        ) ||
        lowerOutput.includes(
            "compilation error"
        ) ||
        lowerOutput.includes(
            "compile error"
        )
    ){
        passed = false;
    }

    if(passed){

        const alreadyCompleted =
            isCodeChallengeCompleted(
                activeCodeChallenge
            );

        markCodeChallengeComplete(
            activeCodeChallenge
        );

        if(alreadyCompleted){

            showCodeResult(
                "✅ Code compiled successfully. Challenge already completed — no additional XP awarded.",
                "success"
            );

        }else{

            const xp =
                addXPForChallenge(
                    activeCodeChallenge
                );

            showCodeResult(
                "✅ Challenge Passed! +" +
                xp +
                " XP",
                "success"
            );
        }

        saveProgress();
        updateRank();
        renderSidebarQuizzes();

    }else{

        showCodeResult(
            "❌ Challenge Failed. Fix the code and try again. Your saved code was kept.",
            "failed"
        );
    }
}

/* =========================================================
   CODE CHALLENGE PROGRESS
   ========================================================= */

function markCodeChallengeComplete(id){

    if(!id){
        return;
    }

    const progress =
        loadCodeProgress();

    if(!progress[id]){

        progress[id] = {
            completed:true,
            completedAt:Date.now()
        };

    }else{

        /*
           Never remove completion.
        */
        progress[id].completed = true;

        if(!progress[id].completedAt){
            progress[id].completedAt =
                Date.now();
        }
    }

    saveCodeProgress(progress);
}

/* =========================================================
   XP
   ========================================================= */

function addXPForChallenge(id){

    /*
       XP values stay controlled.
       Most importantly, XP can only be awarded
       once for each challenge.
    */

    const xpMap = {
        blink:5,
        buzzer:5,
        multiled:5,
        monitor4:5,
        joystick:5,
        servo:5,
        distance:5,
        radar:5,
        custom1:5,
        custom2:5
    };

    const xp =
        xpMap[id] || 5;

    const key =
        "code-" + id;

    /*
       This is the critical anti-infinite-XP check.
    */
    if(progress[key] && progress[key].awarded){
        return 0;
    }

    progress[key] = {
        score:xp,
        total:xp,
        awarded:true,
        completed:true
    };

    saveProgress();

    return xp;
}

/* =========================================================
   CUSTOM PROJECT SUBMISSION
   ========================================================= */

function submitCode(id){

    const editorElement =
        document.getElementById("editor");

    if(!editorElement){
        return;
    }

    const raw =
        editorElement.value;

    if(!raw.trim()){

        showCodeResult(
            "Write code first!",
            "warning"
        );

        return;
    }

    if(!checkArduinoSyntax(raw)) return;

    /*
       Save before analysis.
    */
    saveCurrentCode();

    const code =
        normalize(raw);

    const info =
        complexity(raw,code);

    let passed = false;

    /* ================= CUSTOM 1 ================= */

    if(id === "custom1"){

        const titleElement =
            document.getElementById(
                "projTitle"
            );

        const descElement =
            document.getElementById(
                "projDesc"
            );

        const title =
            titleElement
            ? titleElement.value.trim()
            : "";

        const desc =
            descElement
            ? descElement.value.trim()
            : "";

        passed =
            title.length >= 5 &&
            desc.length >= 20 &&
            info.lines >= 40 &&
            info.vars >= 5 &&
            info.ifs >= 2 &&
            info.loops >= 1 &&
            (
                count(code,"digitalwrite") +
                count(code,"analogread") +
                count(code,"analogwrite") +
                count(code,"serial.print")
            ) >= 8;
    }

    /* ================= CUSTOM 2 ================= */

    else if(id === "custom2"){

        const titleElement =
            document.getElementById(
                "projTitle"
            );

        const descElement =
            document.getElementById(
                "projDesc"
            );

        const title =
            titleElement
            ? titleElement.value.trim()
            : "";

        const desc =
            descElement
            ? descElement.value.trim()
            : "";

        passed =
            title.length >= 5 &&
            desc.length >= 30 &&
            info.lines >= 60 &&
            info.vars >= 8 &&
            info.ifs >= 4 &&
            info.loops >= 2 &&
            (
                count(code,"digitalwrite") +
                count(code,"analogread") +
                count(code,"analogwrite") +
                count(code,"serial.print") +
                count(code,"tone")
            ) >= 15;
    }

    if(passed){

        const alreadyCompleted =
            isCodeChallengeCompleted(id);

        markCodeChallengeComplete(id);

        if(alreadyCompleted){

            showCodeResult(
                "✅ Project passed again. Already completed — no additional XP awarded.",
                "success"
            );

        }else{

            const xp =
                addXPForChallenge(id);

            showCodeResult(
                "✅ Challenge Passed! +" +
                xp +
                " XP",
                "success"
            );
        }

        saveProgress();
        updateRank();
        renderSidebarQuizzes();

    }else{

        showCodeResult(
            "❌ Challenge Failed. Improve the project and try again. Your project was saved locally.",
            "failed"
        );
    }
}

/* =========================================================
   RESULT MESSAGE
   ========================================================= */

function showCodeResult(message,type){

    const box =
        document.getElementById(
            "codeResult"
        );

    if(!box){
        return;
    }

    box.textContent =
        message;

    box.className =
        "codeResult " +
        (type || "");
}

/* =========================================================
   SAVED PROJECTS VIEW
   ========================================================= */

function renderSavedProjects(){

    const old =
        document.getElementById(
            "savedProjects"
        );

    if(old){
        old.remove();
    }

    const projects =
        getSavedProjects();

    if(projects.length === 0){
        return;
    }

    const container =
        document.createElement("div");

    container.id =
        "savedProjects";

    container.className =
        "codeSavedProjects";

    const heading =
        document.createElement("h3");

    heading.textContent =
        "Saved Local Projects";

    container.appendChild(
        heading
    );

    projects.forEach(
        project => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "savedProject";

            const title =
                document.createElement(
                    "strong"
                );

            title.textContent =
                project.title ||
                "Untitled Project";

            const desc =
                document.createElement(
                    "p"
                );

            desc.textContent =
                project.description ||
                "No description.";

            const restore =
                document.createElement(
                    "button"
                );

            restore.type =
                "button";

            restore.textContent =
                "Restore";

            restore.addEventListener(
                "click",
                () => {

                    const projectId =
                        project.id;

                    if(
                        projectId ===
                            "custom1" ||
                        projectId ===
                            "custom2"
                    ){

                        openCodeQuiz({
                            id:projectId,
                            name:
                                project.title ||
                                "Custom Project",
                            desc:
                                project.description ||
                                ""
                        });

                    }
                }
            );

            item.appendChild(title);
            item.appendChild(desc);
            item.appendChild(restore);

            container.appendChild(item);
        }
    );

    const area =
        document.getElementById(
            "quizArea"
        );

    if(area){
        area.appendChild(
            container
        );
    }
}

function highlightQuizCode(code){

    code = code
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");

    const tokens = [];

    const save = html => {
        const id =
            `___QUIZTOKEN${tokens.length}___`;

        tokens.push(html);

        return id;
    };

    /* Comments */
    code = code.replace(
        /(\/\/.*)$/gm,
        m => save(
            `<span style="color:#22c55e">${m}</span>`
        )
    );

    code = code.replace(
        /(\/\*[\s\S]*?\*\/)/g,
        m => save(
            `<span style="color:#22c55e">${m}</span>`
        )
    );

    /* Strings */
    code = code.replace(
        /("(?:\\.|[^"\\])*")/g,
        m => save(
            `<span style="color:#f59e0b">${m}</span>`
        )
    );

    code = code.replace(
        /('(?:\\.|[^'\\])*')/g,
        m => save(
            `<span style="color:#f59e0b">${m}</span>`
        )
    );

    /* Preprocessor */
    code = code.replace(
        /(#(?:include|define|if|ifdef|ifndef|else|elif|endif|pragma|undef|error|warning|line)\b[^\n]*)/g,
        m => save(
            `<span style="color:#f472b6">${m}</span>`
        )
    );

    /* Arduino functions */
    code = code.replace(
        /\b(pinMode|digitalWrite|digitalRead|analogRead|analogWrite|delay|delayMicroseconds|millis|micros|pulseIn|pulseInLong|tone|noTone|shiftIn|shiftOut|attachInterrupt|detachInterrupt|interrupts|noInterrupts)\b/g,
        '<span style="color:#38bdf8">$1</span>'
    );

    /* Serial / communication */
    code = code.replace(
        /\b(Serial|Serial1|Serial2|Serial3|begin|end|available|read|write|print|println|printf|flush|peek|find|findUntil|parseInt|parseFloat|setTimeout)\b/g,
        '<span style="color:#38bdf8">$1</span>'
    );

    /* Arduino constants */
    code = code.replace(
        /\b(HIGH|LOW|INPUT|OUTPUT|INPUT_PULLUP|LED_BUILTIN|DEFAULT|INTERNAL|INTERNAL1V1|INTERNAL2V56|CHANGE|RISING|FALLING|LSBFIRST|MSBFIRST|true|false)\b/g,
        '<span style="color:#fbbf24">$1</span>'
    );

    /* Pins / hardware */
    code = code.replace(
        /\b(A[0-5]|SDA|SCL|MOSI|MISO|SCK|SS|RX|TX|AREF|RESET|VCC|GND|VIN|IOREF)\b/g,
        '<span style="color:#60a5fa">$1</span>'
    );

    /* C / C++ types */
    code = code.replace(
        /\b(void|bool|boolean|char|byte|short|int|long|unsigned|signed|float|double|string|String|size_t|uint8_t|uint16_t|uint32_t|uint64_t|int8_t|int16_t|int32_t|int64_t|word)\b/g,
        '<span style="color:#c084fc">$1</span>'
    );

    /* C / C++ keywords */
    code = code.replace(
        /\b(if|else|for|while|do|switch|case|default|break|continue|return|goto|const|static|volatile|extern|struct|class|public|private|protected|friend|template|typename|namespace|using|new|delete|this|nullptr|auto|register|inline|virtual|override|final|enum|union|try|catch|throw)\b/g,
        '<span style="color:#fb7185">$1</span>'
    );

    /* Arduino libraries */
    code = code.replace(
        /\b(Wire|SPI|EEPROM|Servo|SoftwareSerial|Adafruit_GFX|Adafruit_SSD1306|LiquidCrystal|DHT|OneWire|DallasTemperature|SD|WiFi|Ethernet|Stepper|Wire1|SPI1|LittleFS|FS|IRremote|RTClib|AccelStepper)\b/g,
        '<span style="color:#60a5fa">$1</span>'
    );

    /* Objects */
    code = code.replace(
        /\b(display|Serial|Serial1|Serial2|Serial3|Wire|SPI|lcd|servo|sensor|oled|screen|button|led|motor|relay|buzzer|encoder|rtc|sd|file)\b/g,
        '<span style="color:#e879f9">$1</span>'
    );

    /* Mathematical functions */
    code = code.replace(
        /\b(abs|min|max|constrain|map|pow|sqrt|sq|sin|cos|tan|asin|acos|atan|atan2|random|randomSeed|round|floor|ceil|exp|log)\b/g,
        '<span style="color:#2dd4bf">$1</span>'
    );

    /* Common C / C++ functions */
    code = code.replace(
        /\b(sizeof|memcpy|memmove|memset|memcmp|strcmp|strncmp|strlen|strcpy|strncpy|strcat|strchr|strstr|atoi|atol|atof|malloc|calloc|realloc|free)\b/g,
        '<span style="color:#2dd4bf">$1</span>'
    );

    /* EEPROM / memory */
    code = code.replace(
        /\b(EEPROM\.read|EEPROM\.write|EEPROM\.update|get|put)\b/g,
        '<span style="color:#2dd4bf">$1</span>'
    );

    /* Registers */
    code = code.replace(
        /\b(DDRB|DDRC|DDRD|PORTB|PORTC|PORTD|PINB|PINC|PIND|ADCSRA|ADCSRB|ADMUX|ADCL|ADCH|TCCR0A|TCCR0B|TCCR1A|TCCR1B|TCCR2A|TCCR2B|TCNT0|TCNT1|TCNT2|OCR0A|OCR0B|OCR1A|OCR1B|OCR2A|OCR2B|TIMSK0|TIMSK1|TIMSK2|TIFR0|TIFR1|TIFR2|SREG|SP|SPL|SPH)\b/g,
        '<span style="color:#60a5fa">$1</span>'
    );

    /* Bit / utility macros */
    code = code.replace(
        /\b(bitRead|bitWrite|bitSet|bitClear|bitToggle|highByte|lowByte|_BV|F|PSTR)\b/g,
        '<span style="color:#2dd4bf">$1</span>'
    );

    /* Numbers */
    code = code.replace(
        /\b(0[bB][01]+|0[xX][0-9a-fA-F]+|0[oO][0-7]+|\d+(?:\.\d+)?(?:[eE][+-]?\d+)?[fFlLuU]*)\b/g,
        '<span style="color:#a78bfa">$1</span>'
    );

    /* Restore protected sections */
    code = code.replace(
        /___QUIZTOKEN(\d+)___/g,
        (_,i) => tokens[i]
    );

    return code;
}
