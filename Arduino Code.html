<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="Images/Website-Guide.png">
<title>Arduino IDE Web</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
}

body{
  font-family:monospace;
  background:#0b0f1a;
  color:#fff;
  overflow:hidden;
}

button,
select,
input,
textarea{
  font-family:inherit;
}

button{
  border:1px solid #263653;
  background:#172238;
  color:#fff;
  padding:7px 12px;
  border-radius:5px;
  cursor:pointer;
  transition:.15s;
}

button:hover{
  background:#243657;
  border-color:#3b5685;
}

button:active{
  transform:translateY(1px);
}

button.primary{
  background:#087f83;
  border-color:#0aaeb3;
}

button.primary:hover{
  background:#099da2;
}

button.success{
  background:#116b42;
  border-color:#18a865;
}

button.success:hover{
  background:#168653;
}

button.danger{
  background:#652c35;
  border-color:#98404c;
}

button.danger:hover{
  background:#7b3540;
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

header{
  height:58px;
  display:flex;
  align-items:center;
  gap:7px;
  padding:8px 10px;
  background:#111827;
  border-bottom:1px solid #263044;
  white-space:nowrap;
  overflow-x:auto;
}

header::-webkit-scrollbar{
  height:0;
}

#brand{
  font-weight:bold;
  color:#00d8c9;
  padding:0 8px;
  margin-right:4px;
}

#filename{
  width:125px;
  padding:7px 9px;
  border:1px solid #263653;
  border-radius:5px;
  background:#0b1220;
  color:#fff;
  outline:none;
}

#filename:focus{
  border-color:#00aeb3;
}

.nav-separator{
  width:1px;
  height:26px;
  background:#2a354b;
  margin:0 3px;
}

#editorWrap{
  display:flex;
  height:calc(100vh - 178px);
  min-height:180px;
}

#lineNums{
  width:52px;
  flex-shrink:0;
  background:#0d1422;
  border-right:1px solid #202b3f;
  padding:10px 7px;
  color:#58657a;
  text-align:right;
  font-size:14px;
  line-height:1.4;
  overflow:hidden;
  user-select:none;
}

#lineNums .error-line{
  color:#ff5f67;
  font-weight:bold;
  cursor:pointer;
}

#lineNums .warning-line{
  color:#f5b942;
  font-weight:bold;
  cursor:pointer;
}

#lineNums .active-error{
  background:#51232a;
  border-radius:3px;
}

#editorBox{
  position:relative;
  flex:1;
  min-width:0;
  overflow:hidden;
}

#editor,
#highlight{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  margin:0;
  padding:10px 12px;
  border:0;
  outline:none;
  font-family:monospace;
  font-size:14px;
  line-height:1.4;
  white-space:pre;
  overflow:auto;
  tab-size:2;
}

#highlight{
  z-index:1;
  pointer-events:none;
  color:#d7e2f2;
}

#editor{
  z-index:2;
  resize:none;
  background:transparent;
  color:transparent;
  caret-color:#00ff99;
  overflow:auto;
}

#editor::selection{
  background:rgba(0,180,255,.25);
}

#highlight::-webkit-scrollbar,
#editor::-webkit-scrollbar{
  width:8px;
  height:8px;
}

#highlight::-webkit-scrollbar-thumb,
#editor::-webkit-scrollbar-thumb{
  background:#26344d;
  border-radius:4px;
}

#highlight::-webkit-scrollbar-track,
#editor::-webkit-scrollbar-track{
  background:#0b111d;
}

#errorMarkers{
  position:absolute;
  inset:0;
  z-index:3;
  pointer-events:none;
  overflow:hidden;
}

.error-marker{
  position:absolute;
  left:12px;
  right:12px;
  height:20px;
  border-bottom:2px solid #ff4d5a;
  background:rgba(255,70,80,.06);
}

#errorTooltip{
  position:absolute;
  z-index:30;
  display:none;
  max-width:420px;
  padding:6px 9px;
  border:1px solid #7d3942;
  border-radius:5px;
  background:#24151a;
  color:#ffd7da;
  box-shadow:0 5px 18px rgba(0,0,0,.45);
  font-size:12px;
  line-height:1.35;
  pointer-events:none;
  white-space:normal;
}
/* =========================
   AUTOCOMPLETE
========================= */

#autocomplete{
  position:absolute;
  z-index:20;
  display:none;
  width:260px;
  max-height:230px;
  overflow:auto;
  background:#111827;
  border:1px solid #344563;
  border-radius:6px;
  box-shadow:0 8px 25px rgba(0,0,0,.45);
  font-size:13px;
}

#autocomplete.visible{
  display:block;
}

.autocomplete-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:6px 9px;
  cursor:pointer;
}

.autocomplete-item:hover,
.autocomplete-item.selected{
  background:#1d3150;
}

.autocomplete-name{
  color:#dce8f8;
}

.autocomplete-type{
  color:#7185a3;
  font-size:11px;
}

.autocomplete-help{
  padding:7px 9px;
  border-top:1px solid #293650;
  color:#647994;
  font-size:10px;
}

/* =========================
   BOTTOM
========================= */

#bottomBar{
  height:140px;
  display:grid;
  grid-template-columns:1fr;
  grid-template-rows:37px minmax(0,1fr);
  background:#0d1420;
  border-top:1px solid #263044;
}

#consoleHeader{
  grid-column:1 / -1;
  grid-row:1;
  height:38px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 10px;
  background:#111827;
  border-bottom:1px solid #263044;
  color:#aab7ca;
  font-size:13px;
}

#consoleTitle{
  display:flex;
  align-items:center;
  gap:8px;
}

#statusDot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#64748b;
}

#statusDot.success{
  background:#22c55e;
}

#statusDot.error{
  background:#ef4444;
}

#statusDot.running{
  background:#f59e0b;
}

#consoleButtons{
  display:flex;
  gap:5px;
}

#consoleButtons button{
  padding:3px 8px;
  font-size:12px;
}

#console{
  grid-column:1;
  grid-row:2;
  min-width:0;
  min-height:0;
  margin:0;
  padding:8px 10px;
  overflow:auto;
  color:#b8ffcc;
  background:#080d15;
  font-size:13px;
  line-height:1.4;
  white-space:pre-wrap;
}

#errorPanel{
  grid-column:2;
  grid-row:2;
}

#liveCounter{
  margin-left:auto;
  color:#8ea0b9;
  font-size:12px;
  display:flex;
  align-items:center;
  gap:5px;
}

.live-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#22c55e;
  box-shadow:0 0 7px rgba(34,197,94,.7);
}

#compileInfo{
  color:#7890ad;
  font-size:12px;
  margin-left:5px;
}

.output-error{
  color:#ff7a83;
}

.output-success{
  color:#5ee68c;
}

@media(max-width:900px){

  #brand{
    display:none;
  }

  header{
    gap:5px;
  }

  #filename{
    width:105px;
  }
}

@media(max-width:650px){

  header{
    height:52px;
  }

  #editorWrap{
    height:calc(100vh - 172px);
  }

  #bottomBar{
    height:120px;
  }

  header button{
    padding:6px 8px;
  }

  #lineNums{
    width:42px;
    font-size:12px;
  }

  #editor,
  #highlight{
    font-size:13px;
  }

  #autocomplete{
    width:220px;
  }
}
</style>
</head>

<body>

<header>

  <div id="brand">Arduino IDE Web</div>

  <button onclick="newProject()">New</button>
  <button onclick="document.getElementById('fileInput').click()">Open</button>
  <button onclick="saveFile()">Save</button>

  <div class="nav-separator"></div>

  <button class="primary" onclick="compileCode()">Compile</button>
  <button class="success" onclick="runSimulator()">Run Simulator</button>

  <select id="examples" onchange="loadExample(this.value)">
    <option value="">Examples</option>
    <option value="blink">Blink</option>
    <option value="button">Button</option>
    <option value="button-led">Button LED</option>
    <option value="pwm">PWM</option>
    <option value="multi-led">Multi LED</option>
    <option value="buzzer">Buzzer</option>
    <option value="analog">Analog</option>
    <option value="voltage-monitor">Solar / 9V Voltage Monitor</option>
    <option value="servo">Servo Sweep</option>
    <option value="software-serial">Software Serial</option>
    <option value="joystick">Joystick</option>
    <option value="serial">Serial</option>
    <option value="timer">GSE Full Test</option>
  </select>

  <input id="filename" value="project">

  <div class="nav-separator"></div>

  <button onclick="go('Arduino Guide.html#home')">Home</button>
  <button onclick="go('Examples.html#examples')">Examples</button>
  <button onclick="go('Arduino Quiz.html')">Quizzes</button>
  <button onclick="go('Arduino Tutorial.html#home')">Tutorials</button>
  <button onclick="go('https://darkshadow-dev.github.io/community/Arduino%20Community.html')">Community</button>
  <button onclick="go('Arduino Extended.html#home')">Registry text</button>


  <div id="liveCounter">
    <span class="live-dot"></span>
    Online:
    <span id="onlineCount">0</span>
  </div>

</header>

<input
  type="file"
  id="fileInput"
  style="display:none"
  accept=".ino,.txt,.cpp,.h,.c"
>

<div id="editorWrap">

  <div id="lineNums"></div>

  <div id="editorBox">
  <div id="errorMarkers"></div>
  <div id="errorTooltip"></div>
    <pre id="highlight"></pre>

    <textarea
      id="editor"
      spellcheck="false"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
    ></textarea>

    <div id="autocomplete">

      <div id="autocompleteItems"></div>

      <div class="autocomplete-help">
        Tab / Enter = accept &nbsp; • &nbsp; Esc = close
      </div>

    </div>

  </div>

</div>


<div id="bottomBar">

  <div id="consoleHeader">

    <div id="consoleTitle">

      <span id="statusDot"></span>

      <span>Output</span>

      <span id="compileInfo"></span>

    </div>

    <div id="consoleButtons">

      <button onclick="clearConsole()">Clear</button>

      <button
        id="downloadHexButton"
        onclick="downloadHex()"
        disabled
      >
        Download HEX
      </button>

    </div>

  </div>

  <pre id="console"></pre>

</div>

const API =
  (location.hostname === "localhost" || location.hostname === "127.0.0.1")
    ? "http://127.0.0.1:5000"
    : "https://arduino-guide-6.onrender.com";

function apiUnavailableHelp(){
  const apiHost = new URL(API).hostname;
  if(apiHost === "localhost" || apiHost === "127.0.0.1"){
    return "The local API is not responding. Double-click `Start GSE API.cmd` in the Arduino Guide folder, then retry.";
  }
  return "The hosted Arduino Guide API is not responding yet. Wait briefly for it to wake, then retry.";
}

/* =========================
   LINE NUMBERS
========================= */

function updateLines(){

  const count =
    Math.max(
      1,
      editor.value
        .split("\n")
        .length
    );


  const errorLines =
    getCurrentErrorLines();


  let html = "";


  for(
    let i = 1;
    i <= count;
    i++
  ){

    const error =
      errorLines.errors.includes(i);

    const warning =
      errorLines.warnings.includes(i);


    if(error){

      html +=
        `<div class="error-line" onclick="jumpToLine(${i})">${i} ←</div>`;

    }else if(warning){

      html +=
        `<div class="warning-line" onclick="jumpToLine(${i})">${i} !</div>`;

    }else{

      html +=
        `<div>${i}</div>`;

    }

  }


  lines.innerHTML =
    html;

}

/* =========================
   KEYBOARD
========================= */

function handleEditorKeys(e){

  /* Autocomplete */

  if(
    autocomplete.classList.contains(
      "visible"
    )
  ){

    if(e.key === "ArrowDown"){

      e.preventDefault();

      autocompleteIndex++;


      if(
        autocompleteIndex >=
        autocompleteResults.length
      ){

        autocompleteIndex = 0;

      }


      renderAutocomplete();

      return;

    }


    if(e.key === "ArrowUp"){

      e.preventDefault();

      autocompleteIndex--;


      if(
        autocompleteIndex < 0
      ){

        autocompleteIndex =
          autocompleteResults.length - 1;

      }


      renderAutocomplete();

      return;

    }


    if(
      e.key === "Tab" ||
      e.key === "Enter"
    ){

      if(
        autocompleteResults.length
      ){

        e.preventDefault();

        acceptAutocomplete();

        return;

      }

    }


    if(e.key === "Escape"){

      e.preventDefault();

      hideAutocomplete();

      return;

    }

  }


  /* Ctrl + Space */

  if(
    e.ctrlKey &&
    e.code === "Space"
  ){

    e.preventDefault();

    showAutocomplete(true);

    return;

  }


  /* Normal Tab */

  if(e.key === "Tab"){

    e.preventDefault();

    const start =
      editor.selectionStart;

    const end =
      editor.selectionEnd;


    editor.value =
      editor.value.substring(
        0,
        start
      ) +
      "  " +
      editor.value.substring(
        end
      );


    editor.selectionStart =
      start + 2;

    editor.selectionEnd =
      start + 2;


    updateAll();

    saveLocal();

    return;

  }


  /* Auto close braces */

  if(e.key === "{"){

    const start =
      editor.selectionStart;

    const end =
      editor.selectionEnd;

    const selected =
      editor.value.substring(
        start,
        end
      );


    if(!selected){

      e.preventDefault();

      editor.value =
        editor.value.substring(
          0,
          start
        ) +
        "{}" +
        editor.value.substring(
          end
        );


      editor.selectionStart =
        start + 1;

      editor.selectionEnd =
        start + 1;


      updateAll();

      saveLocal();

      return;

    }

  }

}


/* =========================
   AUTOCOMPLETE
========================= */

function getCurrentWord(){

  const pos =
    editor.selectionStart;

  const before =
    editor.value.substring(
      0,
      pos
    );


  const match =
    before.match(
      /[A-Za-z_][A-Za-z0-9_]*$/
    );


  return match
    ? match[0]
    : "";

}


function updateAutocomplete(){

  const word =
    getCurrentWord();


  if(!word){

    hideAutocomplete();

    return;

  }


  if(word.length < 1){

    hideAutocomplete();

    return;

  }


  showAutocomplete(false);

}


function showAutocomplete(force){

  const word =
    getCurrentWord();


  if(
    !word &&
    !force
  ){

    hideAutocomplete();

    return;

  }


  const lower =
    word.toLowerCase();


  autocompleteResults =
    autocompleteWords
      .filter(item => {

        if(!word){

          return true;

        }


        return item[0]
          .toLowerCase()
          .startsWith(lower);

      })
      .slice(0, 12);


  if(
    !autocompleteResults.length
  ){

    hideAutocomplete();

    return;

  }


  autocompleteIndex = 0;

  positionAutocomplete();

  renderAutocomplete();

  autocomplete.classList.add(
    "visible"
  );

}


function renderAutocomplete(){

  autocompleteItems.innerHTML = "";


  autocompleteResults.forEach(
    (item, index) => {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "autocomplete-item";


      if(
        index === autocompleteIndex
      ){

        div.classList.add(
          "selected"
        );

      }


      div.innerHTML =
        `<span class="autocomplete-name">${escapeHtml(item[0])}</span>
         <span class="autocomplete-type">${escapeHtml(item[1])}</span>`;


      div.addEventListener(
        "mousedown",
        e => {

          e.preventDefault();

          autocompleteIndex =
            index;

          acceptAutocomplete();

        }
      );


      autocompleteItems.appendChild(
        div
      );

    }
  );

}


function positionAutocomplete(){

  const lineHeight =
    parseFloat(
      getComputedStyle(editor).lineHeight
    );


  const paddingTop =
    10;


  const textBefore =
    editor.value.substring(
      0,
      editor.selectionStart
    );


  const line =
    textBefore.split("\n").length - 1;


  const column =
    textBefore.length -
    textBefore.lastIndexOf("\n") -
    1;


  const left =
    12 +
    column * 8.4 -
    editor.scrollLeft;


  const top =
    paddingTop +
    (line + 1) *
    lineHeight -
    editor.scrollTop;


  autocomplete.style.left =
    Math.max(
      5,
      Math.min(
        left,
        editor.clientWidth - 270
      )
    ) + "px";


  autocomplete.style.top =
    Math.max(
      5,
      Math.min(
        top,
        editor.clientHeight - 240
      )
    ) + "px";

}


function acceptAutocomplete(){

  if(!autocompleteResults.length){

    return;

  }


  const item =
    autocompleteResults[
      autocompleteIndex
    ];


  const selected =
    item[0];


  const extra =
    item[2] || "";


  const pos =
    editor.selectionStart;


  const word =
    getCurrentWord();


  const start =
    pos - word.length;


  let insertText =
    selected + extra;


  let cursorOffset =
    insertText.length;


  if(extra === "()"){

    insertText =
      selected + "()";

    cursorOffset =
      selected.length + 1;

  }


  editor.value =
    editor.value.substring(
      0,
      start
    ) +
    insertText +
    editor.value.substring(
      pos
    );


  editor.selectionStart =
    start + cursorOffset;

  editor.selectionEnd =
    start + cursorOffset;


  hideAutocomplete();

  updateAll();

  saveLocal();

}


function hideAutocomplete(){

  autocomplete.classList.remove(
    "visible"
  );

}

/* =========================
   SYNTAX HIGHLIGHTING
========================= */

function highlightCode(){

  let code = editor.value
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

  const tokens = [];

  const save = html => {
    const id = `___TOKEN_${tokens.length}___`;
    tokens.push(html);
    return id;
  };

  /* Comments */

  code = code.replace(/(\/\/.*)$/gm,
    m => save(`<span style="color:#22c55e">${m}</span>`));

  code = code.replace(/(\/\*[\s\S]*?\*\/)/g,
    m => save(`<span style="color:#22c55e">${m}</span>`));

  /* Strings */

  code = code.replace(/("(?:\\.|[^"\\])*")/g,
    m => save(`<span style="color:#f59e0b">${m}</span>`));

  code = code.replace(/('(?:\\.|[^'\\])*')/g,
    m => save(`<span style="color:#f59e0b">${m}</span>`));

  /* Preprocessor */

  code = code.replace(
    /(#(?:include|define|if|ifdef|ifndef|else|elif|endif|pragma|undef|error|warning|line)\b[^\n]*)/g,
    m => save(`<span style="color:#f472b6">${m}</span>`)
  );

  /* Arduino functions */

  code = code.replace(
    /\b(pinMode|digitalWrite|digitalRead|analogRead|analogWrite|delay|delayMicroseconds|millis|micros|pulseIn|pulseInLong|tone|noTone|shiftIn|shiftOut|attachInterrupt|detachInterrupt|interrupts|noInterrupts)\b/g,
    '<span style="color:#38bdf8">$1</span>'
  );

  /* Serial / communication */

  code = code.replace(
    /\b(Serial|Serial1|Serial2|Serial3|begin|end|available|read|write|print|println|printf|flush|peek|find|findUntil|parseInt|parseFloat|setTimeout)\b/g,
    '<span style="color:#38bdf8">$1</span>'
  );

  /* Arduino constants */

  code = code.replace(
    /\b(HIGH|LOW|INPUT|OUTPUT|INPUT_PULLUP|LED_BUILTIN|DEFAULT|INTERNAL|INTERNAL1V1|INTERNAL2V56|CHANGE|RISING|FALLING|LSBFIRST|MSBFIRST)\b/g,
    '<span style="color:#fbbf24">$1</span>'
  );

  /* Pin / hardware related */

  code = code.replace(
    /\b(A[0-5]|SDA|SCL|MOSI|MISO|SCK|SS|RX|TX|AREF|RESET|VCC|GND|VIN|IOREF)\b/g,
    '<span style="color:#60a5fa">$1</span>'
  );

  /* Common C/C++ types */

  code = code.replace(
    /\b(void|bool|boolean|char|byte|short|int|long|unsigned|signed|float|double|string|String|size_t|uint8_t|uint16_t|uint32_t|uint64_t|int8_t|int16_t|int32_t|int64_t|word)\b/g,
    '<span style="color:#c084fc">$1</span>'
  );

  /* C/C++ keywords */

  code = code.replace(
    /\b(if|else|for|while|do|switch|case|default|break|continue|return|goto|const|static|volatile|extern|struct|class|public|private|protected|friend|template|typename|namespace|using|new|delete|this|nullptr|auto|register|inline|virtual|override|final|enum|union|try|catch|throw|true|false)\b/g,
    '<span style="color:#fb7185">$1</span>'
  );

  /* Arduino libraries */

  code = code.replace(
    /\b(Wire|SPI|EEPROM|Servo|SoftwareSerial|Adafruit_GFX|Adafruit_SSD1306|LiquidCrystal|DHT|OneWire|DallasTemperature|SD|WiFi|Ethernet|Stepper|Wire1|SPI1|LittleFS|FS|IRremote|RTClib|AccelStepper)\b/g,
    '<span style="color:#60a5fa">$1</span>'
  );

  /* Display / library objects */

  code = code.replace(
    /\b(display|Serial|Serial1|Serial2|Serial3|Wire|SPI|lcd|servo|sensor|oled|screen|button|led|motor|relay|buzzer|encoder|rtc|sd|file)\b/g,
    '<span style="color:#e879f9">$1</span>'
  );

  /* Mathematical functions */

  code = code.replace(
    /\b(abs|min|max|constrain|map|pow|sqrt|sq|sin|cos|tan|asin|acos|atan|atan2|random|randomSeed|round|floor|ceil|exp|log)\b/g,
    '<span style="color:#2dd4bf">$1</span>'
  );

  /* Common C/C++ functions */

  code = code.replace(
    /\b(sizeof|memcpy|memmove|memset|memcmp|strcmp|strncmp|strlen|strcpy|strncpy|strcat|strchr|strstr|atoi|atol|atof|malloc|calloc|realloc|free)\b/g,
    '<span style="color:#2dd4bf">$1</span>'
  );

  /* Memory / low-level functions */

  code = code.replace(
    /\b(pgm_read_byte|pgm_read_word|pgm_read_dword|EEPROM\.read|EEPROM\.write|EEPROM\.update|get|put)\b/g,
    '<span style="color:#2dd4bf">$1</span>'
  );

  /* Register / bit operations */

  code = code.replace(
    /\b(DDRB|DDRC|DDRD|PORTB|PORTC|PORTD|PINB|PINC|PIND|ADCSRA|ADCSRB|ADMUX|ADCL|ADCH|TCCR0A|TCCR0B|TCCR1A|TCCR1B|TCCR2A|TCCR2B|TCNT0|TCNT1|TCNT2|OCR0A|OCR0B|OCR1A|OCR1B|OCR2A|OCR2B|TIMSK0|TIMSK1|TIMSK2|TIFR0|TIFR1|TIFR2|SREG|SP|SPL|SPH)\b/g,
    '<span style="color:#60a5fa">$1</span>'
  );

  /* Bit / utility macros */

  code = code.replace(
    /\b(bitRead|bitWrite|bitSet|bitClear|bitToggle|highByte|lowByte|_BV|F|PSTR)\b/g,
    '<span style="color:#2dd4bf">$1</span>'
  );

  /* Numbers */

  code = code.replace(
    /\b(0[bB][01]+|0[xX][0-9a-fA-F]+|0[oO][0-7]+|\d+(?:\.\d+)?(?:[eE][+-]?\d+)?[fFlLuU]*)\b/g,
    '<span style="color:#a78bfa">$1</span>'
  );

  /* Restore */

  code = code.replace(
    /___TOKEN_(\d+)___/g,
    (_, i) => tokens[i]
  );

  highlight.innerHTML = code;

}

/* =========================
   SAVE FILE
========================= */

function saveFile(){

  saveLocal();


  const name =
    sanitizeName(
      filename.value
    ) ||
    "project";


  const blob =
    new Blob(
      [editor.value],
      {
        type:"text/plain"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;

  a.download =
    name + ".ino";


  document.body.appendChild(a);

  a.click();

  a.remove();


  setTimeout(
    () =>
      URL.revokeObjectURL(url),
    1000
  );

}


/* =========================
   OPEN FILE
========================= */

function openFile(e){

  const file =
    e.target.files[0];


  if(!file){

    return;

  }


  const reader =
    new FileReader();


  reader.onload = () => {

    editor.value =
      reader.result;


    filename.value =
      file.name.replace(
        /\..+$/,
        ""
      );


    updateAll();

    saveLocal();

    clearErrorPanel();


    consoleBox.textContent =
      "Loaded: " +
      file.name;


    setStatus("idle");

  };


  reader.readAsText(file);

  fileInput.value = "";

}


/* =========================
   COMPILE
========================= */

async function compileCode(){

  const code =
    editor.value;


  if(!code.trim()){

    consoleBox.textContent =
      "Nothing to compile.";

    setStatus("error");

    return;

  }


  const name =
    sanitizeName(
      filename.value
    ) ||
    "project";


  hideAutocomplete();

  clearErrorPanel();


  consoleBox.textContent =
    "Compiling " +
    name +
    "...\n\n" +
    "Connecting to Arduino Guide build server...";


  compileInfo.textContent =
    "Compiling";


  setStatus("running");


  downloadHexButton.disabled =
    true;

  lastHexUrl = null;


  try{

    const res =
      await fetch(
        API + "/compile",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            code:code,
            name:name,
            board:
              "arduino:avr:uno"
          })
        }
      );


    const data =
      await res.json();


    const rawOutput =
      data.output ||
      data.error ||
      "";


    /* =========================
       SUCCESS
    ========================= */

    if(data.success){

      let output =
        "=== COMPILE SUCCESS ===\n\n";


      output +=
        rawOutput ||
        "Compilation completed successfully.";


      if(data.hex_url){

        output +=
          "\n\n=== HEX FILE ===\n" +
          data.hex_url;


        lastHexUrl =
          data.hex_url;


        downloadHexButton.disabled =
          false;

      }


      consoleBox.textContent =
        output;


      compileInfo.textContent =
        "Success";


      setStatus("success");


      localStorage.setItem(
        "arduino_compiled",
        rawOutput
      );

      localStorage.setItem(
        "arduino_compiled_code",
        code
      );

      localStorage.setItem(
        "arduino_compiled_name",
        name
      );

      localStorage.setItem(
        "arduino_compile_success",
        "true"
      );


      clearErrorPanel();


      return;

    }


    /* =========================
       COMPILE FAILED
    ========================= */

    consoleBox.textContent =
      "=== COMPILE FAILED ===";


    compileInfo.textContent =
      "Failed";


    setStatus("error");


    localStorage.setItem(
      "arduino_compile_success",
      "false"
    );


    /*
      The real compiler output is NOT
      shown in the console.

      It is only used internally to
      find the bad line and generate
      the tooltip.
    */

    analyzeCompilerOutput(
      rawOutput
    );


  }catch(error){

    const networkFailure = error instanceof TypeError || /failed to fetch|networkerror/i.test(error.message||"");

    consoleBox.textContent =
      "=== SERVER ERROR ===\n\n" +
      error.message +
      (networkFailure ? "\n\n" + apiUnavailableHelp() : "");


    compileInfo.textContent =
      "Server error";


    setStatus("error");


    localStorage.setItem(
      "arduino_compile_success",
      "false"
    );

  }

}


/* =========================
   COMPILER ERROR ANALYSIS
========================= */

function analyzeCompilerOutput(output){

  const errors = [];

  const warnings = [];


  if(!output){

    renderErrorPanel(
      errors,
      warnings
    );

    return;

  }


  const linesFound =
    output.split("\n");


  linesFound.forEach(
    line => {

      /*
        Arduino / GCC examples:

        project.ino:12:5: error: expected ')'
        project.ino:8:3: warning: ...
      */

      const match =
        line.match(
          /:(\d+)(?::(\d+))?:\s*(?:fatal error|error|warning):\s*(.*)/i
        );


      if(!match){

        return;

      }


      const lineNumber =
        parseInt(
          match[1],
          10
        );


      const columnNumber =
        match[2]
          ? parseInt(
              match[2],
              10
            )
          : null;


      const message =
        match[3].trim();


      const lower =
        message.toLowerCase();


      let type =
        "error";


      if(
        line
          .toLowerCase()
          .includes("warning")
      ){

        type =
          "warning";

      }


      const help =
        getErrorHelp(
          lower,
          message,
          columnNumber
        );


      const item = {
        line:lineNumber,
        column:columnNumber,
        message:message,
        help:help,
        tooltip:help,
        type:type
      };


      if(type === "warning"){

        warnings.push(item);

      }else{

        errors.push(item);

      }

    }
  );


  /*
    Some library errors don't contain
    a normal source-line reference.
  */

  if(
    errors.length === 0 &&
    /No such file or directory/i.test(
      output
    )
  ){

    const includeMatch =
      output.match(
        /fatal error:\s*([^:]+):\s*No such file or directory/i
      );


    if(includeMatch){

      errors.push({
        line:0,
        column:null,
        message:
          "Missing library/header: " +
          includeMatch[1],
        help:
          getErrorHelp(
            "no such file or directory",
            includeMatch[1],
            null
          ),
        tooltip:
          getErrorHelp(
            "no such file or directory",
            includeMatch[1],
            null
          ),
        type:"error"
      });

    }

  }


  renderErrorPanel(
    errors,
    warnings
  );


  updateAll();

}


/* =========================
   ERROR HELP
========================= */

function getErrorHelp(
  lower,
  original,
  column
){

  if(
    lower.includes(
      "no such file or directory"
    )
  ){

    return (
      "This usually means the library is not installed " +
      "or the #include name is incorrect. " +
      "Check the library name and make sure it is supported " +
      "by Arduino Guide."
    );

  }


  if(
    lower.includes(
      "expected ';'"
    ) ||
    lower.includes(
      "expected ';' before"
    )
  ){

    if(column){

      return (
        "Expected ';' — check the statement near column " +
        column +
        "."
      );

    }

    return (
      "A semicolon (;) is probably missing at the end " +
      "of the statement."
    );

  }


  if(
    lower.includes(
      "expected ')'"
    )
  ){

    if(column){

      return (
        "Expected ')' — add ')' after column " +
        column +
        "."
      );

    }

    return (
      "Expected ')' — add the missing ')' near this line."
    );

  }


  if(
    lower.includes(
      "expected '('"
    )
  ){

    if(column){

      return (
        "Expected '(' — add '(' near column " +
        column +
        "."
      );

    }

    return (
      "Expected '(' — check the function or condition on this line."
    );

  }


  if(
    lower.includes(
      "expected '{'"
    )
  ){

    return (
      "Expected '{' — add an opening { for this block."
    );

  }


  if(
    lower.includes(
      "expected '}'"
    ) ||
    lower.includes(
      "expected '}' at end of input"
    )
  ){

    return (
      "A closing } is missing. Check that every { has a matching }."
    );

  }


  if(
    lower.includes(
      "was not declared in this scope"
    )
  ){

    return (
      "Arduino/C++ cannot find this name. " +
      "Check spelling, capitalization, variable declarations, " +
      "and whether the required library is included."
    );

  }


  if(
    lower.includes(
      "too few arguments"
    )
  ){

    return (
      "This function needs more arguments. " +
      "Check the function's expected parameters."
    );

  }


  if(
    lower.includes(
      "too many arguments"
    )
  ){

    return (
      "This function received more arguments than expected. " +
      "Check the function call."
    );

  }


  if(
    lower.includes(
      "was not declared"
    )
  ){

    return (
      "This name is unknown to the compiler. " +
      "Check its spelling and declaration."
    );

  }


  if(
    lower.includes(
      "invalid conversion"
    )
  ){

    return (
      "A value is being used with an incompatible type. " +
      "Check the variable types and function parameters."
    );

  }


  if(
    lower.includes(
      "expected primary-expression"
    )
  ){

    return (
      "There is probably an incomplete expression, missing value, " +
      "operator, or bracket near this line."
    );

  }


  if(
    lower.includes(
      "stray"
    )
  ){

    return (
      "The compiler found an unexpected character. " +
      "Check quotation marks, brackets, and special characters."
    );

  }


  if(
    lower.includes(
      "redefinition"
    )
  ){

    return (
      "Something has been declared more than once. " +
      "Check for duplicate variables, functions, or objects."
    );

  }


  if(
    lower.includes(
      "multiple definition"
    )
  ){

    return (
      "The same function or variable appears more than once."
    );

  }


  if(
    lower.includes(
      "undefined reference"
    )
  ){

    return (
      "The code refers to something that has no implementation. " +
      "Check the required library or function."
    );

  }


  if(
    lower.includes(
      "expected unqualified-id"
    )
  ){

    return (
      "There may be a syntax error near this line, such as an " +
      "extra bracket, missing type, or malformed declaration."
    );

  }


  if(
    lower.includes(
      "missing terminating"
    )
  ){

    return (
      "A string or character quote was opened but not closed."
    );

  }


  if(
    lower.includes(
      "invalid preprocessing directive"
    )
  ){

    return (
      "The # preprocessor command is not recognized. " +
      "Check #include, #define, and other directives."
    );

  }


  return (
    "Check this line and the few lines immediately above it. " +
    "The compiler message gives the exact reason."
  );

}


/* =========================
   ERROR MARKERS
========================= */

function renderErrorPanel(
  errors,
  warnings
){

  compilerErrors =
    errors || [];


  compilerWarnings =
    warnings || [];


  updateErrorMarkers();

  updateLines();

}


/* =========================
   UPDATE ERROR MARKERS
========================= */

function updateErrorMarkers(){

  if(!errorMarkers){

    return;

  }


  errorMarkers.innerHTML = "";


  if(!compilerErrors.length){

    return;

  }


  const lineHeight =
    parseFloat(
      getComputedStyle(editor).lineHeight
    );


  const editorPaddingTop =
    10;


  compilerErrors.forEach(
    error => {

      if(
        !error.line ||
        error.line < 1
      ){

        return;

      }


      const marker =
        document.createElement(
          "div"
        );


      marker.className =
        "error-marker";


      marker.dataset.line =
        error.line;


      marker.dataset.message =
        error.tooltip ||
        error.message;


      marker.style.top =
        (
          editorPaddingTop +
          (
            error.line - 1
          ) *
          lineHeight -
          editor.scrollTop
        ) + "px";


      marker.style.height =
        lineHeight + "px";


      errorMarkers.appendChild(
        marker
      );

    }
  );

}


/* =========================
   FIND ERROR
========================= */

function getErrorAtLine(
  lineNumber
){

  return compilerErrors.find(
    error =>
      error.line === lineNumber
  ) || null;

}


/* =========================
   ERROR TOOLTIP
========================= */

function showErrorTooltip(
  lineNumber,
  mouseX,
  mouseY
){

  if(
    !errorTooltip ||
    !editorBox
  ){

    return;

  }


  const error =
    getErrorAtLine(
      lineNumber
    );


  if(!error){

    errorTooltip.style.display =
      "none";

    return;

  }


  errorTooltip.textContent =
    error.tooltip ||
    error.help ||
    error.message;


  errorTooltip.style.display =
    "block";


  const rect =
    editorBox.getBoundingClientRect();


  let left =
    mouseX -
    rect.left +
    12;


  let top =
    mouseY -
    rect.top +
    12;


  const tooltipWidth =
    Math.min(
      420,
      editorBox.clientWidth - 10
    );


  const maxLeft =
    editorBox.clientWidth -
    tooltipWidth -
    5;


  if(left > maxLeft){

    left =
      Math.max(
        5,
        maxLeft
      );

  }


  if(left < 5){

    left = 5;

  }


  if(
    top + 60 >
    editorBox.clientHeight
  ){

    top =
      mouseY -
      rect.top -
      60;

  }


  if(top < 5){

    top = 5;

  }


  errorTooltip.style.left =
    left + "px";


  errorTooltip.style.top =
    top + "px";

}


/* =========================
   GET EDITOR LINE
========================= */

function getEditorLineFromMouse(
  event
){

  if(!editor){

    return 1;

  }


  const rect =
    editor.getBoundingClientRect();


  const lineHeight =
    parseFloat(
      getComputedStyle(
        editor
      ).lineHeight
    );


  const paddingTop =
    10;


  const y =
    event.clientY -
    rect.top +
    editor.scrollTop -
    paddingTop;


  return Math.max(
    1,
    Math.floor(
      y / lineHeight
    ) + 1
  );

}


/* =========================

========================= */

function clearErrorPanel(){

  compilerErrors = [];

  compilerWarnings = [];


  if(errorMarkers){

    errorMarkers.innerHTML =

  }


  if(errorTooltip){

    errorTooltip.style.display =

  }

}

/* =========================
   JUMP TO LINE
========================= */

function jumpToLine(
  lineNumber
){

  if(
    !lineNumber ||
    lineNumber < 1
  ){

    return;

  }


  const allLines =
    editor.value.split(
      "\n"
    );


  let position = 0;


  for(
    let i = 0;
    i < lineNumber - 1 &&
    i < allLines.length;
    i++
  ){

    position +=
      allLines[i].length +
      1;

  }


  editor.focus();


  editor.selectionStart =
    position;


  editor.selectionEnd =
    Math.min(
      position +
      (
        allLines[
          lineNumber - 1
        ] || ""
      ).length,
      editor.value.length
    );


  const lineHeight =
    parseFloat(
      getComputedStyle(
        editor
      ).lineHeight
    );


  editor.scrollTop =
    Math.max(
      0,
      (
        lineNumber - 3
      ) *
      lineHeight
    );


  syncScroll();

}

/* =========================
   SIMULATOR
========================= */

async function runSimulator(){

  const code =
    editor.value;


  if(!code.trim()){

    consoleBox.textContent =
      "Nothing to simulate.";

    setStatus("error");

    return;

  }


  hideAutocomplete();

  clearErrorPanel();


  consoleBox.textContent =
    "Creating GSE simulator...\n\n" +
    "Parsing Arduino source...";


  compileInfo.textContent =
    "Simulator";


  setStatus("running");


  try{

    const res =
      await fetch(
        API + "/create",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            code:code,
            name:
              filename.value,
            board:
              "arduino:avr:uno"
          })
        }
      );


    const data =
      await res.json();


    if(
      !res.ok ||
      !data.success
    ){

      throw new Error(
        data.error ||
        data.output ||
        "Failed to create simulator."
      );

    }


    consoleBox.textContent =
      "=== SIMULATOR READY ===\n\n" +
      "GSE executable created.\n" +
      "Opening Arduino Uno simulator...";


    setStatus("success");


    if(!data.token){
      throw new Error("Server did not return a GSE token.");
    }

    const simulatorURL = new URL("Arduino Uno.html", window.location.href);
    simulatorURL.searchParams.set("gse", data.token);
    window.location.href = simulatorURL.href;

  }catch(error){

    const networkFailure = error instanceof TypeError || /failed to fetch|networkerror/i.test(error.message||"");

    console.error(
      "Simulator error:",
      error
    );


    consoleBox.textContent =
      "=== SIMULATOR ERROR ===\n\n" +
      error.message + (networkFailure ? "\n\n" + apiUnavailableHelp() : "");


    compileInfo.textContent =
      "Failed";


    setStatus("error");

  }

}

/* =========================
   HELPERS
========================= */

function sanitizeName(name){

  return String(
    name || ""
  )
    .replace(
      /[^a-zA-Z0-9_-]/g,
      ""
    )
    .trim();

}


function escapeHtml(value){

  return String(
    value || ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function setStatus(type){

  statusDot.className = "";


  if(type === "success"){

    statusDot.classList.add(
      "success"
    );

  }


  if(type === "error"){

    statusDot.classList.add(
      "error"
    );

  }


  if(type === "running"){

    statusDot.classList.add(
      "running"
    );

  }


  if(type === "idle"){

    compileInfo.textContent =
      "";

  }

}


function clearConsole(){

  consoleBox.textContent =
    "";

  compileInfo.textContent =
    "";

  clearErrorPanel();

  compilerErrors = [];
  compilerWarnings = [];

  updateLines();

  setStatus("idle");
